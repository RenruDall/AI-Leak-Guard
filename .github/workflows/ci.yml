name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Unit and publish-script tests
        run: npm test
      - name: Browser tests (extension loaded in Chromium)
        run: npm run test:e2e
      - name: Build package
        id: build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ai-leak-guard-${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.zip }}
