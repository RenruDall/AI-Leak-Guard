<!doctype html><html lang="en"><meta charset="utf-8"><title>Assistant</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;background:#F7F7F8;color:#1F2328}
aside{width:250px;background:#EFEFF2;padding:18px 14px;border-right:1px solid #E2E2E6}
aside b{display:block;font-size:14px;margin:4px 6px 16px}aside div{padding:8px 10px;border-radius:8px;color:#555;font-size:14px;margin-bottom:2px}aside div.on{background:#E2E2E8;color:#1F2328}
main{flex:1;display:flex;flex-direction:column;align-items:center}
.msgs{flex:1;width:min(760px,90%);padding:40px 0;display:flex;flex-direction:column;gap:18px}
.m{max-width:80%;padding:12px 16px;border-radius:16px;background:#fff;border:1px solid #E6E6EA}.m.me{align-self:flex-end;background:#E8EEFF;border-color:#D7E0FF}
.box{width:min(760px,90%);margin:0 0 34px;background:#fff;border:1px solid #DADAE0;border-radius:22px;padding:12px 12px 12px 18px;display:flex;gap:10px;align-items:flex-end;box-shadow:0 6px 24px rgba(0,0,0,.06)}
textarea{flex:1;border:0;outline:0;resize:none;font:inherit;min-height:72px}
@media (prefers-color-scheme:dark){body{background:#0f1115;color:#e6e8ec}aside{background:#15181e;border-color:#23272f}aside div{color:#9aa1ad}aside div.on{background:#232832;color:#e6e8ec}.m{background:#1a1e25;border-color:#262b34}.m.me{background:#1d2a45;border-color:#253556}.box{background:#1a1e25;border-color:#2a2f39}textarea{background:transparent;color:#e6e8ec}button{background:#e6e8ec;color:#0f1115}}
button{width:38px;height:38px;border-radius:50%;border:0;background:#1F2328;color:#fff;font-size:16px}
</style>
<aside><b>Assistant</b><div class="on">Supplier payment email</div><div>Quarterly report draft</div><div>Team offsite ideas</div></aside>
<main><div class="msgs"><div class="m me">Can you help me write a short, polite payment reminder?</div><div class="m">Of course. Paste the details you want to include and I'll draft it.</div></div>
<div class="box"><textarea id="ta" placeholder="Message the assistant"></textarea><button id="send" aria-label="Send message">➤</button></div></main></html>
